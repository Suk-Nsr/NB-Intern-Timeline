        .tab-content.active > *:nth-child(3) { animation-delay: 0.15s; }
        .tab-content.active > *:nth-child(4) { animation-delay: 0.2s; }
        .tab-content.active > *:nth-child(5) { animation-delay: 0.25s; }

        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .timeline-btn {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);

        // Function to render progress dots
        function renderProgressDots() {
            if(!progressDots) return;
            timelineData.forEach((_, index) => {
                const dot = document.createElement('div');
                dot.id = `progress-dot-${index}`;
                dot.className = `w-3 h-3 rounded-full transition-colors duration-500 z-0 ${index === 0 ? 'bg-sky-400 shadow-[0_0_8px_rgba(14,165,233,0.8)]' : 'bg-gray-600'}`;
                progressDots.appendChild(dot);
            });
        }

                btn.className = `timeline-btn w-full text-left px-5 py-4 flex items-center gap-4 shrink-0 md:shrink md:w-auto hover:bg-white/5 border-b md:border-b-0 ${index !== timelineData.length - 1 ? 'border-white/5' : 'border-transparent'}
                                ${index === 0 ? 'active' : 'text-gray-400'}`;
                btn.onclick = () => switchTab(index);
                btn.id = `tab-btn-${index}`;
                
                btn.innerHTML = `
                    <div class="flex flex-col">
                        <span class="text-xs font-semibold tracking-wider ${index === 0 ? 'text-sky-400' : 'text-gray-500'} uppercase transition-colors" id="tab-label-${index}">Week ${data.week}</span>
                        <span class="text-sm hidden md:block whitespace-nowrap truncate font-medium mt-1">${data.date}</span>
                    </div>
                `;
                navContainer.appendChild(btn);
            });
        }

        // Function to render Content
        function renderContent() {
            timelineData.forEach((data, index) => {
                const contentDiv = document.createElement('div');
                contentDiv.id = `tab-content-${index}`;
                contentDiv.className = `tab-content ${index === 0 ? 'active' : ''}`;
                
                let tasksHtml = data.tasks.map(task => `
                    <li class="flex items-start gap-4 group">
                        <div class="mt-1.5 w-2 h-2 rounded-full bg-sky-500/50 group-hover:bg-sky-400 group-hover:shadow-[0_0_12px_rgba(56,189,248,0.8)] transition-all duration-300 shrink-0 ring-4 ring-sky-500/10"></div>
                        <p class="text-gray-300/90 text-sm md:text-base leading-relaxed group-hover:text-gray-200 transition-colors">${task}</p>
                    </li>
                `).join('');

                contentDiv.innerHTML = `
                    <div class="flex items-center gap-2 text-sky-400 mb-3 font-medium tracking-wide">
                        <div class="bg-sky-500/10 px-3 py-1 rounded-full border border-sky-500/20 flex items-center gap-2">
                            <i class="fa-solid fa-calendar-days text-xs"></i> 
                            <span class="text-xs uppercase font-bold tracking-widest">${data.date}</span>
                        </div>
                    </div>
                    <h3 class="text-2xl md:text-3xl lg:text-4xl font-bold text-white mb-8 flex items-center gap-4 leading-tight">
                        <div class="w-14 h-14 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center shadow-lg backdrop-blur-sm shrink-0">
                            <i class="fa-solid ${data.icon} text-2xl text-transparent bg-clip-text bg-gradient-to-br from-sky-400 to-indigo-400"></i>
                        </div>
                        <span class="bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400">${data.title}</span>
                    </h3>
                    
                    <div class="bg-black/20 rounded-2xl p-6 md:p-8 border border-white/5 mb-6 backdrop-blur-sm">
                        <h4 class="text-xs font-bold text-sky-500/80 uppercase tracking-widest mb-6 flex items-center gap-2">
                            <i class="fa-solid fa-list-check"></i> Task & Operations
                        </h4>
                        <ul class="space-y-5">
                            ${tasksHtml}
                        </ul>
                    </div>

                    ${data.highlight ? `
                        <div class="bg-gradient-to-r from-sky-500/10 to-indigo-500/10 border border-sky-500/20 rounded-2xl p-6 flex items-start gap-5 relative overflow-hidden group">
                            <div class="absolute inset-0 bg-gradient-to-r from-sky-400/0 via-sky-400/5 to-transparent -translate-x-full group-hover:translate-x-full duration-1000 transition-transform"></div>
                            <div class="w-10 h-10 rounded-full bg-amber-500/10 flex items-center justify-center shrink-0 border border-amber-500/20 mt-0.5">
                                <i class="fa-solid fa-star text-amber-400 text-sm"></i>
                            </div>
                            <div class="relative z-10">
                                <h4 class="text-sm font-bold text-sky-300 mb-2 uppercase tracking-wider">Key Takeaway</h4>
                                <p class="text-sm md:text-base text-sky-100/90 leading-relaxed font-medium">${data.highlight}</p>
                            </div>
                        </div>
                    ` : ''}
                    
                    ${data.video ? `
                        <div class="mt-8 bg-black/30 rounded-2xl p-5 border border-white/5 backdrop-blur-sm">
                            <h4 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                                <i class="fa-solid fa-circle-play text-sky-500"></i> Video Demonstration
                            </h4>
                            <div class="rounded-xl overflow-hidden border border-white/10 shadow-[0_0_30px_rgba(0,0,0,0.5)] group relative">
                                <div class="absolute inset-0 rounded-xl ring-1 ring-inset ring-white/10 pointer-events-none z-10"></div>
                                <video controls class="w-full h-auto max-h-[450px] object-cover bg-black" preload="metadata">
                                    <source src="${data.video}" type="video/mp4">
                                    Your browser does not support the video tag.
                                </video>
                            </div>
                        </div>
                    ` : ''}
                `;
                contentContainer.appendChild(contentDiv);
            });
        }

        // Function to handle switching tabs
        function switchTab(activeIndex) {
            // Update Progress Bar
            if(progressLine && satelliteIndicator) {
                const percentage = (activeIndex / (timelineData.length - 1)) * 100;
                progressLine.style.width = `${percentage}%`;
                satelliteIndicator.style.left = `${percentage}%`;
                
                // Update dots
                timelineData.forEach((_, idx) => {
                    const dot = document.getElementById(`progress-dot-${idx}`);
                    if(dot) {
                        if(idx <= activeIndex) {
                            dot.className = 'w-3 h-3 rounded-full bg-sky-400 shadow-[0_0_8px_rgba(14,165,233,0.8)] transition-all duration-500 z-0 relative';
                        } else {
                            dot.className = 'w-3 h-3 rounded-full bg-gray-600 transition-all duration-500 z-0 relative';
                        }
                    }
                });
            }

            // Update Buttons
            timelineData.forEach((_, index) => {
                const btn = document.getElementById(`tab-btn-${index}`);
                const label = document.getElementById(`tab-label-${index}`);
                const content = document.getElementById(`tab-content-${index}`);
                
                if (index === activeIndex) {
                    btn.classList.add('active');
                    label.classList.add('text-sky-400');
                    label.classList.remove('text-gray-500');
                    
                    // Add animation class
                    content.classList.add('active');
                } else {
                    btn.classList.remove('active');
                    label.classList.remove('text-sky-400');
                    label.classList.add('text-gray-500');
                    
                    content.classList.remove('active');
                }
            });
            
            // Scroll selected button into view on mobile
            const activeBtn = document.getElementById(`tab-btn-${activeIndex}`);
            if(window.innerWidth < 768) {
                activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            renderContent();
            renderProgressDots();
            switchTab(0);
        });
    </script>
</body>
</html>
