    <script>
        // Data Structure
        const timelineData = [
            { week: 1, date: "25 พ.ค. - 29 พ.ค.", title: "Project Initiation & Problem Analysis", icon: "fa-magnifying-glass", highlight: "กำหนดมาตรฐานสากล: คอมเมนต์และอธิบายการทำงานในโค้ดทั้งหมดต้องเป็นภาษาอังกฤษ", tasks: ["<b>ทำความเข้าใจระบบ:</b> ศึกษาวิธีการใช้งาน FlatSat และวิเคราะห์ข้อบกพร่องของชุดการทดลองเดิม", "<b>วิเคราะห์ปัญหา (Pain Points):</b> พบว่าแล็บเดิมมีลักษณะเพียง 'อ่านค่าเซนเซอร์แล้วจด' และแจกโค้ดสำเร็จรูป (Ready-to-use) ทำให้นักศึกษาไม่ได้ฝึกคิดวิเคราะห์", "<b>เสนอแนวทางแก้ไข (Solution):</b> เปลี่ยนมาใช้แนวคิด <b>'Skeleton Code'</b> (โค้ดเจาะรู) เพื่อบังคับให้ผู้เรียนต้องเปิดอ่าน Data Sheet และทำความเข้าใจ Library ด้วยตัวเอง"] },
            { week: 2, date: "1 มิ.ย. - 5 มิ.ย.", title: "Brainstorming & Prototype Development", icon: "fa-lightbulb", highlight: "กำเนิดโครงร่างหลักสูตร FlatSat ชุดใหม่ที่เน้น Systems Engineering", tasks: ["<b>ออกแบบโครงสร้างแล็บ:</b> วางโครงร่างหลักสูตรตั้งต้นไว้ 8 แล็บ ครอบคลุมตั้งแต่ OBC, การจัดการไฟล์ (SPI Flash/SD Card), พลังงาน (Safe Mode), การสื่อสาร (KISS Protocol) และภารกิจจำลอง", "<b>สร้าง Repository:</b> ก่อตั้งโปรเจกต์ <code>Flatsat-Labs</code> บน GitHub (เริ่มวันที่ 4 มิ.ย.)", "<b>พัฒนาโค้ดต้นแบบ (Prototype):</b> พัฒนาโค้ดและเฉลยสำหรับ Lab 1 (OBC Init), Lab 2 (Data Storage) และ Lab 3 (EPS)", "<b>ปรับโครงสร้างโค้ด:</b> ปรับปรุงเป็นรูปแบบ Modular Programming เพื่อความเป็นระเบียบและง่ายต่อการเรียนรู้"] },
            { week: 3, date: "8 มิ.ย. - 12 มิ.ย.", title: "Automation & Core Features", icon: "fa-code-branch", highlight: "นำทักษะ Software Engineering มาประยุกต์ใช้สร้างระบบแจกจ่ายไฟล์อัตโนมัติ", tasks: ["<b>สร้างระบบ CI/CD (Automation):</b> พัฒนา GitHub Actions Workflow เพื่อแพ็กไฟล์ ZIP สำหรับแจกจ่ายให้นักศึกษาดาวน์โหลดอัตโนมัติ (Release Files)", "<b>ปรับปรุงเสถียรภาพโค้ด:</b> แก้ไขบั๊ก, เพิ่ม Testbench ตรวจสอบความถูกต้อง, ปรับแก้โค้ดควบคุมพลังงาน และเปลี่ยนมาใช้เช็ค Serial Input แทนคำสั่ง delay()", "<b>พัฒนาระบบสื่อสาร:</b> เริ่มพัฒนาโค้ดสำหรับ Lab 4 (RF Communication & KISS Protocol) พร้อมทั้งเขียน Testbench ฝั่งดาวเทียม"] },
            { week: 4, date: "15 มิ.ย. - 19 มิ.ย.", title: "The Great Restructure", icon: "fa-layer-group", highlight: "การปรับตัวแก้ไขแผนงานอย่างรวดเร็ว (Agility) โดยไม่ทิ้งสาระสำคัญของหลักสูตร", tasks: ["<b>รับมือความท้าทาย:</b> ได้รับคำสั่งด่วนให้ยุบเนื้อหาหลักสูตรลงให้เหลือเพียง 4-5 แล็บ", "<b>แก้ปัญหาแบบ Agility:</b> ตัดสินใจแยก Repository ออกเป็น 2 ชุดเพื่อคงเนื้อหาสำคัญไว้ ได้แก่ <code>Full_Labs</code> (7 แล็บเต็ม) และ <code>Final_Labs</code> (ยุบเหลือ 5 แล็บ)", "<b>การควบรวมเนื้อหา (Final_Labs):</b> นำ Lab 1+4 เดิมมารวมกันเป็น Lab 1 ใหม่ และนำ Lab 2+3 เดิมมารวมกันเป็น Lab 2 ใหม่ เพื่อความกระชับแต่ความรู้ยังครบถ้วน"] },
            { week: 5, date: "22 มิ.ย. - 26 มิ.ย.", title: "The Final Mission & System Integration", icon: "fa-rocket", highlight: "จุดสูงสุดของหลักสูตร: การบูรณาการวิศวกรรมระบบดาวเทียมทั้งฮาร์ดแวร์และซอฟต์แวร์", tasks: ["<b>จัดทำเอกสาร Lab 7:</b> ร่างข้อกำหนดการทำงาน (Functional Requirements) สำหรับภารกิจจำลอง 1 รอบวงโคจร (The Final Mission)", "<b>ออกแบบ System Integration:</b> นำระบบทั้งหมด (OBC, EPS, GPS, Camera, COMMS) มารวมร่างกันเป็น State Machine", "<b>เพิ่มภารกิจท้าทาย (Optional):</b> ออกแบบข้อสอบเพิ่มคะแนนพิเศษ เช่น High-Speed Downlink และระบบระบุกลุ่มดาวจำลอง (Star Tracker)", "<b>เคลียร์ระบบขั้นสุดท้าย:</b> แก้บั๊ก Testbench, ขยายเวลา Timeout, เช็ค CRC32 และแบ่งไฟล์ Release ให้ชัดเจน"] },
            { week: 6, date: "29 มิ.ย. - 3 ก.ค.", title: "Server Infrastructure (Ad-hoc Task)", icon: "fa-server", highlight: "แสดงศักยภาพนอกเหนือจากงานหลักด้านโค้ดดิ้ง สู่การจัดการระดับ Infrastructure", tasks: ["<b>รับงานมอบหมายพิเศษ:</b> เมื่อตัวหลักสูตร FlatSat เริ่มเสร็จสมบูรณ์และนิ่งแล้ว ได้รับมอบหมายงานทางวิศวกรรมเพิ่มเติม", "<b>ตั้งค่าระบบเครือข่าย:</b> ดำเนินการติดตั้งและตั้งค่า Debian Server ให้กับทีมเพื่อใช้เป็นโครงสร้างพื้นฐานในการพัฒนางานอื่นๆ ต่อไป"] },
            { week: 7, date: "6 ก.ค. - 10 ก.ค.", title: "Internationalization", icon: "fa-language", highlight: "ทักษะด้านการสื่อสารและการแปลเอกสารวิชาการทางวิศวกรรม", tasks: ["<b>ยกระดับผลิตภัณฑ์สู่สากล:</b> ต้อนรับคณะตัวแทนจากฟิลิปปินส์ที่เข้ามาเยี่ยมชมและศึกษาผลิตภัณฑ์ FlatSat Learning Kit", "<b>แปลเอกสาร (Translation):</b> ดำเนินการแปลเอกสารคู่มือปฏิบัติการทั้งหมดให้เป็นเวอร์ชันภาษาอังกฤษ เพื่อเตรียมรองรับกลุ่มผู้ใช้งานระดับนานาชาติ"] },
            { week: 8, date: "13 ก.ค. - 17 ก.ค.", title: "Advanced Hardware Integration", icon: "fa-microchip", video: "eMMC_Testing.mp4", highlight: "การเรียนรู้และรับมือกับสถาปัตยกรรมไมโครคอนโทรลเลอร์รุ่นใหม่ที่ซับซ้อนขึ้น", tasks: ["<b>ทดสอบฮาร์ดแวร์ใหม่:</b> ได้รับมอบหมายพิเศษให้ทำการทดสอบและเขียนโปรแกรมบนบอร์ดประมวลผลประสิทธิภาพสูง (STM32H723ZGT6U)", "<b>การเชื่อมต่อ eMMC:</b> ศึกษาและพัฒนาโค้ดจนสามารถอ่านและเขียนไฟล์ข้อมูลขนาดใหญ่ลงในหน่วยความจำชิป eMMC ได้สำเร็จตามความคาดหมาย"] },
            { week: 9, date: "20 ก.ค. - 24 ก.ค.", title: "FlatSat Desktop UI Development", icon: "fa-desktop", highlight: "ก้าวเข้าสู่การพัฒนา Application ฝั่งผู้ใช้งาน (Frontend/Desktop App)", tasks: ["<b>ต่อยอดการใช้งาน (UX/UI):</b> ได้รับโปรเจกต์มอบหมายใหม่ในการพัฒนาซอฟต์แวร์ควบคุมการบินและแสดงผลข้อมูลสำหรับ FlatSat", "<b>FlatSat Desktop:</b> เริ่มต้นพัฒนาระบบ Dashboard ที่มี GUI สวยงาม เพื่อให้ผู้ใช้งานสามารถสั่งการและรับชม Telemetry ของดาวเทียมได้ง่ายๆ เพียงแค่ปลายนิ้วคลิก"] }

        // Circular State Management
        let currentWaypoint = -1;
        let isPausedAtWaypoint = false;
        let orbitProgress = -0.05; // Start slightly behind Week 1
        let targetOrbitProgress = -0.05;
        let travelSpeed = 0.005;
        const totalWaypoints = timelineData.length;

        // --- THREE.JS SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 8000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Enable physical shadows so the Earth casts a dark shadow on the night side!
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Lighting
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.2); // Lowered so shadows and bump maps pop
        scene.add(hemiLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.5); // Strong sun for sharp shadows
        sunLight.position.set(500, 200, 300); // Moved sun 10x further away to stay outside scaled Earth
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 10;
        sunLight.shadow.camera.far = 2000; // Increased shadow depth
        sunLight.shadow.camera.left = -250; // Increased shadow bounds 10x to cover the entire scaled Earth
        sunLight.shadow.camera.right = 250;
        sunLight.shadow.camera.top = 250;
        sunLight.shadow.camera.bottom = -250;
        sunLight.shadow.bias = -0.0005; // Prevent shadow acne
        scene.add(sunLight);

        // Starfield Background
        const starsGeometry = new THREE.BufferGeometry();
        const starsMaterial = new THREE.PointsMaterial({ color: 0xFFFFFF, size: 0.1, transparent: true, opacity: 0.8 });
        const starsVertices = [];
        for (let i = 0; i < 5000; i++) {
            const x = (Math.random() - 0.5) * 8000; // Pushed stars further back
            const y = (Math.random() - 0.5) * 8000;
            const z = (Math.random() - 0.5) * 8000; // Distribute stars on all sides
            starsVertices.push(x, y, z);
        }
        starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
        const starField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starField);

        // Earth Setup
        const earthRadius = 150; // SCALED 10X
        const earthGroup = new THREE.Group();
        // Flip Earth upside down (North to South) as requested
        earthGroup.rotation.z = Math.PI;
        scene.add(earthGroup);

        // Loading Manager
        const manager = new THREE.LoadingManager();
        manager.onLoad = function () {
            const loadingScreen = document.getElementById('loading-screen');
            const introScreen = document.getElementById('intro-screen');
            loadingScreen.style.opacity = '0';
            loadingScreen.style.pointerEvents = 'none';
            setTimeout(() => {
                loadingScreen.style.display = 'none';

                // Show Intro Screen
                introScreen.style.display = 'flex';
                setTimeout(() => {
                    introScreen.style.opacity = '1';
                }, 50);
            }, 1000);
        };
        manager.onProgress = function (url, itemsLoaded, itemsTotal) {
            document.getElementById('loading-text').innerText = `Loading Assets... ${Math.round((itemsLoaded / itemsTotal) * 100)}%`;
        };
        const textureLoader = new THREE.TextureLoader(manager);

        // Ultra-High Resolution Earth Mesh
        // Increase segments drastically for 10K/21K textures to show topography better
        const earthGeometry = new THREE.SphereGeometry(earthRadius, 128, 128);
        const earthMaterial = new THREE.MeshPhongMaterial({
            map: textureLoader.load('assets/earthButPictures/earth_color_8K.jpg'),
            bumpMap: textureLoader.load('assets/earthButPictures/topography_8K.jpg'),
            bumpScale: 10, // Increased significantly so mountains cast visible shadows
            specularMap: textureLoader.load('assets/earthButPictures/earth_landocean_8K.jpg'),
            specular: new THREE.Color(0x222222), // Reduced specular reflection to avoid glaring white blowout
            shininess: 30, // Higher shininess concentrates the reflection so it's a smaller, more realistic glint
            emissiveMap: textureLoader.load('assets/earthButPictures/earth_nightlights_8K.jpg'),
            emissive: new THREE.Color(0xffffff),
            emissiveIntensity: 1.0 // Brighter night lights
        });

        // Custom shader injection to make nightlights ONLY visible on the dark side of the earth
        earthMaterial.onBeforeCompile = function (shader) {
            shader.uniforms.sunDirection = { value: new THREE.Vector3(500, 200, 300).normalize() };

            shader.vertexShader = `
                varying vec3 vEarthWorldNormal;
            ` + shader.vertexShader;

            shader.vertexShader = shader.vertexShader.replace(
                '#include <worldpos_vertex>',
                `
                #include <worldpos_vertex>
                // Calculate world normal for day/night detection
                vEarthWorldNormal = normalize((modelMatrix * vec4(normal, 0.0)).xyz);
                `
            );

            shader.fragmentShader = `
                uniform vec3 sunDirection;
                varying vec3 vEarthWorldNormal;
            ` + shader.fragmentShader;

            shader.fragmentShader = shader.fragmentShader.replace(
                '#include <emissivemap_fragment>',
                `
                #ifdef USE_EMISSIVEMAP
                    vec4 emissiveColor = texture2D( emissiveMap, vUv );
                    
                    // Calculate day/night mix (1.0 on night side, 0.0 on day side)
                    float sunDot = dot(vEarthWorldNormal, sunDirection);
                    // Fade out night lights smoothly across the terminator line
                    float nightMix = smoothstep(0.2, -0.2, sunDot);
                    
                    totalEmissiveRadiance *= emissiveColor.rgb * nightMix;
                #endif
                `
            );
        };

        let earthMesh = new THREE.Mesh(earthGeometry, earthMaterial);
        earthMesh.rotation.z = 23.5 * Math.PI / 180;
        earthMesh.castShadow = true;
        earthMesh.receiveShadow = true;
        earthGroup.add(earthMesh);

        // Clouds Layer (Restored to safe AdditiveBlending)
        const cloudGeometry = new THREE.SphereGeometry(earthRadius * 1.01, 64, 64);
        const cloudMaterial = new THREE.MeshPhongMaterial({
            map: textureLoader.load('assets/earthButPictures/earth_clouds_8K.jpg'),
            transparent: true,
            opacity: 0.35,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        let cloudMesh = new THREE.Mesh(cloudGeometry, cloudMaterial);
        earthMesh.add(cloudMesh);

        // Atmosphere glow (Perspective Correct BackSide Shader - TRULY Bulletproof)
        const atmosphereGeometry = new THREE.SphereGeometry(earthRadius * 1.05, 64, 64);
        const atmosphereMaterial = new THREE.ShaderMaterial({
            uniforms: {
                sunDirection: { value: new THREE.Vector3(500, 200, 300).normalize() }
            },
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vWorldNormal;
                varying vec3 vViewPosition; // Added for perspective correction
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vWorldNormal = normalize((modelMatrix * vec4(normal, 0.0)).xyz);
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    vViewPosition = -mvPosition.xyz; // Vector from vertex to camera
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform vec3 sunDirection;
                varying vec3 vNormal;
                varying vec3 vWorldNormal;
                varying vec3 vViewPosition;
                void main() {
                    // Perspective correct view direction
                    vec3 viewDir = normalize(vViewPosition);
                    
                    // For BackSide, normal points outwards, viewDir points towards camera.
                    // dot product is negative. d goes from 0 (visual edge) to 1 (back center).
                    // Because we use the actual perspective viewDir, d is EXACTLY 0.0 at the visual tangent!
                    float d = -dot(vNormal, viewDir);
                    
                    float intensity = 0.0;
                    
                    // Earth limb is at d = 0.305 for a 1.05x sphere (independent of camera distance!)
                    if (d < 0.305) {
                        // Fade from 0 at the outer edge to 1 at the limb
                        intensity = smoothstep(0.0, 0.305, d);
                    } else {
                        // Fade from 1 at the limb to 0 behind the earth
                        intensity = smoothstep(1.0, 0.305, d);
                    }
                    
                    // Sun lighting (Atmospheric scattering is complex. In reality, you see a bright ring 
                    // from the dark side due to forward scattering. We simulate this by keeping a high ambient glow).
                    float sunIntensity = max(0.0, dot(vWorldNormal, sunDirection));
                    // 0.7 ambient means the aura is always at least 70% bright even on the pitch-black night side!
                    float finalIntensity = intensity * (sunIntensity * 0.3 + 0.3);
                    
                    // Power curve
                    finalIntensity = pow(finalIntensity, 1.5) * 2.5; // Boosted slightly for visibility
                    
                    gl_FragColor = vec4(0.2, 0.5, 1.0, 1.0) * finalIntensity;
                }
            `,
            blending: THREE.AdditiveBlending,
            side: THREE.BackSide, // Physically behind the earth
            transparent: true,
            depthWrite: false
        });
        const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
        earthGroup.add(atmosphere);

        // Orbit Curve (Inclined ellipse) - Tight orbit to make Earth fill the screen
        const orbitRadiusX = 175;
        const orbitRadiusY = 175;
        const orbitCurve = new THREE.EllipseCurve(0, 0, orbitRadiusX, orbitRadiusY, 0, 2 * Math.PI, false, 0);

        function get3DOrbitPosition(t) {
            const pt2d = orbitCurve.getPoint(t % 1.0);
            // Horizontal orbit (Equatorial orbit around the latitude)
            const x = pt2d.x;
            const y = 0;
            const z = pt2d.y;
            return new THREE.Vector3(x, y, z);
        }

        // Visualize Orbit Path
        const pathPoints = [];
        for (let i = 0; i <= 100; i++) {
            pathPoints.push(get3DOrbitPosition(i / 100));
        }
        const pathGeometry = new THREE.BufferGeometry().setFromPoints(pathPoints);
        const pathMaterial = new THREE.LineBasicMaterial({ color: 0x0ea5e9, transparent: true, opacity: 0.25 });
        const orbitLine = new THREE.Line(pathGeometry, pathMaterial);
        scene.add(orbitLine);

        // Waypoint Markers
        const waypointMarkers = [];
        const waypointGeometry = new THREE.SphereGeometry(0.3, 16, 16);
        const waypointMaterial = new THREE.MeshBasicMaterial({ color: 0x0ea5e9 });
        for (let i = 0; i < totalWaypoints; i++) {
            const wpProgress = i / totalWaypoints;
            const pos = get3DOrbitPosition(wpProgress);
            const marker = new THREE.Mesh(waypointGeometry, waypointMaterial);
            marker.position.copy(pos);

            const ringGeo = new THREE.RingGeometry(0.5, 0.6, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.copy(pos);

            scene.add(marker);
            scene.add(ring);
            waypointMarkers.push({ marker, ring, progress: wpProgress });
        }

        // Build/Load Satellite Model (Dragon.obj from assets/satellite/)
        const satelliteGroup = new THREE.Group();
        scene.add(satelliteGroup);

        if (window.THREE.OBJLoader) {
            const objLoader = new THREE.OBJLoader(manager);

            const dragonAlbedo = textureLoader.load('assets/satellite/Albedo.jpg');
            const dragonNormal = textureLoader.load('assets/satellite/NormalMap.jpg');
            const dragonRoughness = textureLoader.load('assets/satellite/roughness.jpg');
            const dragonEmission = textureLoader.load('assets/satellite/emission.jpg');

            // Let Three.js use default flipY for OBJ
            // We just create a standard material
            const dragonMaterial = new THREE.MeshBasicMaterial({
                map: dragonAlbedo,
                color: 0xffffff,
                side: THREE.DoubleSide
            });

            // Create a procedural grid texture for solar panels
            const canvasT = document.createElement('canvas');
            canvasT.width = 512; canvasT.height = 512;
            const ctx = canvasT.getContext('2d');
            ctx.fillStyle = '#1e3a8a'; ctx.fillRect(0, 0, 512, 512); // Rich blue background so it's not pitch black
            ctx.strokeStyle = '#7dd3fc'; ctx.lineWidth = 6; // Thicker, brighter sky blue lines
            for (let i = 0; i <= 512; i += 32) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
            }
            const panelTex = new THREE.CanvasTexture(canvasT);
            panelTex.wrapS = THREE.RepeatWrapping; panelTex.wrapT = THREE.RepeatWrapping;
            panelTex.repeat.set(6, 2);

            // Use Basic Material so it's ALWAYS brightly lit and visible, 
            // exactly like the glowing effect from the original version that the user loved.
            // No custom shaders or physical shadows needed for the panels anymore.
            const panelMaterial = new THREE.MeshBasicMaterial({
                map: panelTex,
                color: 0xffffff,
                side: THREE.DoubleSide
            });

            objLoader.load('assets/satellite/Dragon.obj', (obj) => {
                // The Dragon OBJ's nose naturally points to -Z. 
                // We rotate it 180 degrees so the nose points to +Z, making lookAt() work correctly.
                obj.rotation.y = Math.PI;

                obj.traverse((child) => {
                    if (child.isMesh) {
                        child.geometry.computeVertexNormals(); // Crucial for lighting!
                        child.geometry.center(); // Fix origin issues
                        child.castShadow = true;
                        child.receiveShadow = true;

                        // Detect if the mesh is a solar panel using bounding box aspect ratio
                        child.geometry.computeBoundingBox();
                        const size = child.geometry.boundingBox.getSize(new THREE.Vector3());
                        // If it's very wide compared to its height and depth, it's likely a panel!
                        const isPanel = (size.x > size.y * 3 && size.x > size.z * 1.5) ||
                            (size.z > size.y * 3 && size.z > size.x * 1.5);

                        if (isPanel) {
                            child.material = panelMaterial; // Apply custom glowing grid
                        } else {
                            child.material = dragonMaterial;
                        }
                    }
                });
                // Scale Dragon model appropriately
                const box = new THREE.Box3().setFromObject(obj);
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                let scaleFactor = 1.0;
                if (maxDim > 0) {
                    scaleFactor = 3.0 / maxDim; // Scale to ~2 units
                    obj.scale.set(scaleFactor, scaleFactor, scaleFactor);
                }

                satelliteGroup.add(obj);
            }, undefined, (err) => {
                console.warn("OBJ Satellite load fallback:", err);
                buildProceduralSatellite();
            });
        } else {
            buildProceduralSatellite();
        }

        function buildProceduralSatellite() {
            const bodyGeo = new THREE.BoxGeometry(0.8, 0.8, 1.2);
            const bodyMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
            const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            satelliteGroup.add(bodyMesh);

            const panelGeo = new THREE.BoxGeometry(3.0, 0.05, 1.2);
            const panelMat = new THREE.MeshBasicMaterial({ color: 0x113366 });
            const leftPanel = new THREE.Mesh(panelGeo, panelMat);
            leftPanel.position.set(-1.9, 0, 0);
            satelliteGroup.add(leftPanel);
            const rightPanel = new THREE.Mesh(panelGeo, panelMat);
            rightPanel.position.set(1.9, 0, 0);
            satelliteGroup.add(rightPanel);
        }

        // --- LOGIC & UI INTERACTION ---

        const uiOverlay = document.getElementById('content-overlay');
        const dynamicContent = document.getElementById('dynamic-content');
        const hudWaypoint = document.getElementById('hud-waypoint');
        const btnContinue = document.getElementById('btn-continue');
        const btnPrevious = document.getElementById('btn-previous');
        const navDotsContainer = document.getElementById('nav-dots');

        // Init Nav Dots
        timelineData.forEach((data, index) => {
            const dot = document.createElement('div');
            dot.className = `nav-dot w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition-all duration-300 ${index === 0 ? 'bg-sky-400 text-white shadow-[0_0_10px_rgba(14,165,233,0.8)] scale-110' : 'bg-gray-700/80 text-gray-400 hover:bg-gray-600'}`;
            dot.innerText = data.week;
            dot.onclick = () => flyToWaypoint(index);
            navDotsContainer.appendChild(dot);
        });

        function updateNavDots(activeIndex) {
            const dots = navDotsContainer.children;
            for (let i = 0; i < dots.length; i++) {
                if (i === activeIndex) {
                    dots[i].className = 'nav-dot w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition-all duration-300 bg-sky-400 text-white shadow-[0_0_10px_rgba(14,165,233,0.8)] scale-110';
                } else {
                    dots[i].className = 'nav-dot w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition-all duration-300 bg-gray-700/80 text-gray-400 hover:bg-gray-600';
                }
            }
        }

        function renderWaypointContent(index) {
            const data = timelineData[index];

            let tasksHtml = data.tasks.map(task => `
                <li class="flex items-start gap-3">
                    <div class="mt-1 w-2 h-2 rounded-full bg-sky-400 shadow-[0_0_8px_rgba(14,165,233,0.8)] shrink-0"></div>
                    <p class="text-gray-200 text-sm md:text-base leading-relaxed">${task}</p>
                </li>
            `).join('');

            dynamicContent.innerHTML = `
                <div class="flex items-center gap-2 text-sky-400 mb-3 font-medium">
                    <i class="fa-solid fa-calendar-days"></i> 
                    <span class="tracking-wide text-sm">WEEK ${data.week} : ${data.date}</span>
                </div>
                <h3 class="text-3xl md:text-4xl font-bold text-white mb-8 flex items-center gap-4">
                    <div class="w-14 h-14 rounded-xl bg-sky-500/10 border border-sky-400/30 flex items-center justify-center shrink-0">
                        <i class="fa-solid ${data.icon} text-2xl text-sky-400"></i>
                    </div>
                    ${data.title}
                </h3>
                
                <div class="bg-black/40 rounded-2xl p-6 border border-white/10 mb-6">
                    <h4 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4">Task & Operations</h4>
                    <ul class="space-y-4">
                        ${tasksHtml}
                    </ul>
                </div>



                ${data.video ? `
                    <div class="mt-6 bg-black/40 rounded-xl p-5 border border-white/10">
                        <h4 class="text-xs font-bold text-sky-400 uppercase tracking-wider mb-3 flex items-center gap-2"><i class="fa-solid fa-circle-play"></i> Video Demonstration</h4>
                        <div class="rounded-lg overflow-hidden border border-white/10">
                            <video controls class="w-full h-auto max-h-[400px] object-cover bg-black" preload="metadata">
                                <source src="${data.video}" type="video/mp4">
                                Your browser does not support the video tag.
                            </video>
                        </div>
                    </div>
                ` : ''}
            `;
        }

        function triggerWaypoint(index) {
            isPausedAtWaypoint = true;
            hudWaypoint.innerText = `Orbit Stopped: Week ${index + 1}`;
            hudWaypoint.classList.add('text-amber-400');

            renderWaypointContent(index);
            uiOverlay.classList.add('active');

            waypointMarkers[index].ring.material.color.setHex(0xffd700);
            waypointMarkers[index].ring.scale.set(1.5, 1.5, 1.5);

            updateNavDots(index);
        }

        // STRICT CIRCULAR FORWARD ORBIT LOGIC
        function flyToWaypoint(targetIndex) {
            uiOverlay.classList.remove('active');

            if (currentWaypoint >= 0) {
                waypointMarkers[currentWaypoint].ring.material.color.setHex(0xffffff);
                waypointMarkers[currentWaypoint].ring.scale.set(1, 1, 1);
            }

            if (targetIndex === currentWaypoint && isPausedAtWaypoint) {
                triggerWaypoint(targetIndex);
                return;
            }

            currentWaypoint = targetIndex;
            let targetProgress = waypointMarkers[targetIndex].progress;

            // Always move FORWARD in the circular orbit!
            // If target progress is less than or equal to current orbitProgress,
            // add 1.0 so the satellite travels forward past the wrap point to reach it.
            let currentNormalized = orbitProgress % 1.0;
            // Handle edge case: if we are behind 0 (e.g. -0.15 at launch)
            if (orbitProgress < 0) currentNormalized = orbitProgress;

            if (targetProgress <= currentNormalized && orbitProgress >= 0) {
                targetOrbitProgress = Math.floor(orbitProgress) + 1.0 + targetProgress;
            } else {
                targetOrbitProgress = Math.floor(orbitProgress < 0 ? 0 : orbitProgress) + targetProgress;
            }

            // DYNAMIC SPEED: Calculate distance to target and set speed to reach it in exactly ~3 seconds
            let distance = targetOrbitProgress - orbitProgress;
            travelSpeed = Math.max(0.03, distance / 1.0);

            hudWaypoint.innerText = `En Route to Week ${currentWaypoint + 1}...`;
            hudWaypoint.classList.remove('text-amber-400');
            isPausedAtWaypoint = false;

            updateNavDots(currentWaypoint);
        }

        // Intro Button Logic
        document.getElementById('btn-enter-orbit').addEventListener('click', () => {
            const introScreen = document.getElementById('intro-screen');
            introScreen.style.opacity = '0';
            introScreen.style.pointerEvents = 'none';
            setTimeout(() => {
                introScreen.style.display = 'none';
                flyToWaypoint(0); // Launch to Week 1!
            }, 1000);
        });

        btnContinue.addEventListener('click', () => {
            const nextIdx = (currentWaypoint + 1) % totalWaypoints;
            flyToWaypoint(nextIdx);
        });

        btnPrevious.addEventListener('click', () => {
            const prevIdx = (currentWaypoint - 1 + totalWaypoints) % totalWaypoints;
            flyToWaypoint(prevIdx);
        });


        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Rotate Earth and Clouds
            // Because Earth is flipped upside down, we must reverse the local rotation speed 
            // to keep it spinning West-to-East visually on screen.
            earthGroup.rotation.y -= 0.05 * delta;
            cloudMesh.rotation.y -= 0.01 * delta; // Clouds drift slightly faster than the earth

            if (!isPausedAtWaypoint) {
                // Use the dynamic travelSpeed instead of fixed 0.25
                orbitProgress += travelSpeed * delta;

                if (orbitProgress >= targetOrbitProgress) {
                    orbitProgress = targetOrbitProgress;
                    const normalizedProgress = orbitProgress % 1.0;
                    triggerWaypoint(currentWaypoint);
                }
            }

            // Calculate Satellite position & forward trajectory
            // Ensure values are properly wrapped for negative progress (during launch)
            const currentNorm = (orbitProgress % 1.0 + 1.0) % 1.0;
            const currentPos = get3DOrbitPosition(currentNorm);
            const lookAheadPos = get3DOrbitPosition((currentNorm + 0.01) % 1.0);

            // Calculate true coordinate frame for both Satellite and Camera
            const upVec = currentPos.clone().normalize();
            const forwardVec = lookAheadPos.clone().sub(currentPos).normalize();
            const rightVec = upVec.clone().cross(forwardVec).normalize();

            // Position camera behind, slightly above, and to the LEFT
            // Moved slightly closer to the satellite as requested
            const backOffset = forwardVec.clone().multiplyScalar(-4);
            const upOffset = upVec.clone().multiplyScalar(4);
            const leftOffset = rightVec.clone().multiplyScalar(-3.2);

            // CRITICAL FIX: Removed .normalize() which was forcing the camera to be 1.0 unit away!
            const cameraOffset = backOffset.clone().add(upOffset).add(leftOffset);

            satelliteGroup.position.copy(currentPos);

            // To prevent the satellite from spinning wildly, we must lock its roll relative to the camera.
            const baseUp = cameraOffset.clone().normalize();
            const earthDir = currentPos.clone().multiplyScalar(-1).normalize();

            // Rotate 45 degrees from the camera plane. 
            // This is the sweet spot: the panels still face the camera enough to be highly visible,
            // but they have enough 3D depth to look realistic, and they catch sunlight beautifully 
            // without being totally self-shadowed.
            baseUp.applyAxisAngle(earthDir, 45 * Math.PI / 180);

            satelliteGroup.up.copy(baseUp.normalize());
            // Point the satellite head directly towards the center of the Earth (0,0,0)
            satelliteGroup.lookAt(new THREE.Vector3(0, 0, 0));

            const idealCameraPos = currentPos.clone().add(cameraOffset);

            // Increased lerp speed slightly so camera follows smoothly without jitter
            camera.position.lerp(idealCameraPos, 0.5);

            // Look slightly to the RIGHT (+2) and DOWN (-2) to push the satellite to the TOP LEFT
            const targetOffset = rightVec.clone().multiplyScalar(2).add(upVec.clone().multiplyScalar(-2)).add(forwardVec.clone().multiplyScalar(4));
            const targetLookAt = currentPos.clone().add(targetOffset);

            // TILT the camera: by leaning the camera's "Up" vector to the LEFT (-rightVec),
            // the Earth (which is physically down) is forced to appear at the BOTTOM RIGHT of the screen!
            let tiltedUp = upVec.clone().add(rightVec.clone().multiplyScalar(-0.8)).normalize();

            // Add a 30 degree counter-clockwise roll to the camera as requested
            const lookAxis = targetLookAt.clone().sub(idealCameraPos).normalize();
            tiltedUp.applyAxisAngle(lookAxis, -20 * Math.PI / 180);

            camera.up.copy(tiltedUp);
            camera.lookAt(targetLookAt);

            // Animate waypoint rings
            waypointMarkers.forEach(wp => {
                wp.ring.rotation.z += 1 * delta;
                wp.ring.lookAt(camera.position);
            });

            renderer.render(scene, camera);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start Loop
        animate();

    </script>
